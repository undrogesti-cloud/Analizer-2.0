[project]
name = "analizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "undrogesti-cloud", email = "undro.gesti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "osmnx>=2.1.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "streamlit-folium>=0.27.4",
]

[project.scripts]
analizer = "analizer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ruff>=0.17.2",
]
